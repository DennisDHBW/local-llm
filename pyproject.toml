[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localllm"
version = "0.1.0"
description = "Lokale KI-Agenten-Architektur für Dokumentenanalyse (RAG, GraphRAG, ReAct)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "diskcache>=5.6.3",
    "matplotlib>=3.10.9",
    "networkx>=3.0",
    "ollama>=0.3.0",
    "psutil>=7.2.2",
    "pydantic>=2.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.2.0",
    "rapidocr_onnxruntime>=1.4.4",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.65.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "evaluation"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=9.1.1",
    "pytest-testmon>=2.2.0",
    "ruff>=0.17.1",
]

# ---------------------------------------------------------------------------------------------------------------
# Werkzeuge
# ---------------------------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Standard: schnelle Tests ohne Sprachmodell. Tests gegen ein laufendes Ollama: uv run pytest -m ollama
addopts = "-m 'not ollama'"
markers = [
    "ollama: braucht ein laufendes Ollama mit den konfigurierten Modellen (langsam, viel RAM)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = [
    "E501",    # Zeilenlänge: 132 Zeilen > 120 Zeichen; wird in einem eigenen Formatierungsschritt gekürzt
    "SIM105",  # try/except/pass ist hier bewusst explizit (Kommentar am except)
    "SIM108",  # if/else-Block statt Einzeiler: bei langen Ausdrücken lesbarer
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]   # Importe nach dem Ergänzen von sys.path (Start über `streamlit run app.py`)
